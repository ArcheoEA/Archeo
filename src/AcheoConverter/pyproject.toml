# pyproject.toml

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ArcheoConverter"
version = "1.0.0"
description = "Architectural model converter, comparator and management tool for ArchiMate 3.2/4.0"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name="Enterprise Architect Team", email="architect@example.com"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
keywords = ["archimate", "modeling", "converter", "comparator", "enterprise-architecture"]

dependencies = [
    "pydantic>=2.4",
    "PyQt5>=5.15.9",
    "Jinja2>=3.1.2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.7.0",
    "mypy>=1.4.1",
    "flake8>=6.0.0"
]

[project.scripts]
archeoconverter = "ui.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ArcheoConverter*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --cov=core,import_export,converter,comparison,search --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["PyQt5.*"]
ignore_missing_imports = true
