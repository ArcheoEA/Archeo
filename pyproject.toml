[project]
name = "ArcheoEA"
version = "0.0.1"
authors = [
  { name="Maxime TOLEDANO", email="toledano.maxime@free.fr" },
]
description = "ArcheoEA is a semantic power strip for the archaeology of your enterprise architecture. ArcheoConverter is its model import/convert/compare/export engine."
readme = "README.md"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2.6",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.urls]
Homepage = "https://github.com/ArcheoEA/Archeo"

[project.scripts]
acheoconverter = "ArcheoConverter.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ArcheoConverter = ["ui/*.html", "ui/*.js", "ui/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
