# config/log_config.yaml (same as logging in settings.yaml)
version: 1
disable_existing_loggers: false

formatters:
  detailed:
    format: "[%(asctime)s] %(levelname)-8s [%(name)s:%(lineno)d] %(message)s"

handlers:
  console:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout

  file_handler:
    class: logging.FileHandler
    level: DEBUG
    formatter: detailed
    filename: logs/ArcheoConverter.log
    mode: a+

root:
  level: DEBUG
  handlers: [console, file_handler]
